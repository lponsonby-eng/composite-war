<!doctype html>
<meta charset="utf-8">
<title>Composite War</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="css/style.css">

<div id="app">
  <header id="topbar">
    <span id="tb-faction" class="tb-faction"></span>
    <span class="tb-stat" title="Gold">Gold <b id="tb-gold">0</b></span>
    <span class="tb-stat" title="Turn">Turn <b id="tb-turn">1</b></span>
    <span class="tb-stat" title="Towns held">Towns <b id="tb-spots">0</b></span>
    <span class="tb-spacer"></span>
    <button id="btn-help" type="button">Help</button>
    <button id="btn-save" type="button">Save</button>
    <button id="btn-sound" type="button">Sound on</button>
    <button id="end-turn" type="button" class="primary">End Turn</button>
  </header>

  <main id="stage">
    <canvas id="view"></canvas>
    <div id="battle-hud"></div>
    <div id="battle-ctrl"></div>
    <div id="turn-banner" hidden></div>
    <div id="capture-banner" hidden></div>
    <canvas id="bminimap" width="200" height="128" title="Click to look there"></canvas>
    <div id="map-ctrl">
      <canvas id="minimap" width="200" height="120" title="Click to jump there"></canvas>
      <div class="zbtns"><button id="zoom-in" type="button" title="Zoom in">+</button><button id="zoom-out" type="button" title="Zoom out">-</button><button id="zoom-home" type="button" title="Back to your capital">Home</button></div>
    </div>
  </main>

  <aside id="panel"></aside>
  <footer id="log"></footer>
</div>

<div id="title-screen" hidden></div>
<div id="modal" hidden></div>

<template id="help-text">
  <h2>How to play</h2>
  <p><b>Goal:</b> defeat every rival faction by taking all their towns.</p>
  <p><b>The map:</b> drag to scroll (or use the arrow keys / WASD), scroll the mouse wheel or pinch to zoom.
    Click the minimap in the corner to jump anywhere; <b>Home</b> returns to your capital.</p>
  <p><b>Your turn:</b> click one of your towns (yellow name). Click generals in the side panel to tick or untick them.
    Roads to neighbouring towns light up: <b>white</b> = move there, <b>red</b> = attack.</p>
  <p><b>Frontline and backline:</b> Warriors and their troops are frontline; Marksmen, Mages and their troops are backline.
    In battle the frontline deploys in front and holds enemies up as they pass, and goes after anyone threatening its backline.
    The backline stays behind its front line, steps back from melee when it can, and hits weaker when caught in melee.
    Bring both: a backline with no frontline is easy prey.</p>
  <p><b>Hero classes and recruiting:</b> each hero is a <b>Warrior</b> (recruits infantry, cavalry and beasts), a <b>Marksman</b>
    (shooters and artillery) or a <b>Mage</b> (battle mages and healers), and recruits from their own faction's units.
    A faction's <b>lord</b> can recruit any of the faction's units and commands up to 24 soldiers (other heroes 16).
    Press <b>Recruit</b> next to a hero to choose troops, mix types in one squad, or dismiss soldiers. <b>Cavalry</b> hit twice as hard
    on the charge but spearmen punish them; <b>artillery</b> fires far with big blasts; <b>healers</b> mend the most hurt ally nearby.</p>
  <p><b>Landmarks:</b> each faction's landmark stands beside its capital and empowers one of its own units in
    battles nearby: Aster's Royal Bastion toughens Knights, Frostmark's Heart of Winter sharpens Frost Eyes, the Thornwood's
    Old Hollow strengthens Witches, the Ember Clan's Mountain of Fire fuels Fire Spirits, the Shadow Order's Whispering Ruins
    feed Ghosts, the Horde's Mother Mushroom grows Bog Beasts, the Azure Tide's Prism Spires focus Crystal Eyes, and the
    Sun Pyramid hardens Sun Guards. The power is full near the landmark (which always covers the capital) and fades with
    distance. It only works while the faction holds its capital, so taking a capital also breaks its power. Select a town
    to see which powers reach it.</p>
  <p><b>Signature abilities:</b> every hero has two abilities of their own, rolled at random when they appear: one learned at
    level 15 and their best at level 30 (heroes level up to 40). Some are big single strikes, others area blasts, auras or
    heals, and they come in strengths of 1 to 5 stars. A hero with strong abilities is worth more to hire or persuade.
    See them in the hero's Recruit window; in battle they are on the skill bar.</p>
  <p><b>Promotion:</b> soldiers level up in battle (for surviving, winning and each kill). At level 15 they are promoted
    (silver pip) and at level 30 again (two gold pips), getting much stronger each time. Heroes of level 10+ can recruit
    veterans for 3x the price. Keep your veterans alive!</p>
  <p>Each general can move or attack once per turn. <b>Recruiting</b> refills a general's squad for gold and is free to do any time.</p>
  <p><b>Formation:</b> before a battle you fight yourself, choose which squads stand in the <b>front row</b> (nearest the enemy)
    and which in the <b>back row</b>, and their order along the line. Heroes remember their row.</p>
  <p><b>Battles</b> are fought by <b>blocks of hundreds of men</b> (each soldier takes the field as 5 men) on a large field seen
    from high above, with the whole battlefield in view. Every block has <b>morale</b>, shown under its portrait: Steady, Wavering or Routing.
    Losses, blows into its <b>flank or rear</b> (which also hit harder), charges and a fallen general shake it; a routing block flees and
    may rally once safe. Win by breaking the enemy's blocks, so try to hit them from the side.</p>
  <p>A battle starts paused. Click a block or its <b>marker</b> to select it (Shift-click or drag a box for several, or click its portrait
    at the top). <b>Right-click</b> the ground to move there (on touch: tap the ground), or an enemy to attack it. <b>Right-drag</b> to draw
    a front line: the selected blocks spread along it, as wide as you drew it, facing across it (to the left of the way you dragged).
    Several blocks move in the chosen <b>formation</b>
    (Auto: frontline in front, backline behind; Line; Column; Wedge). <b>Advance</b>, <b>Hold</b> and <b>Retreat</b> apply to the
    selected squads (or all). Advancing frontline troops <b>charge</b> the last stretch and hit harder on impact.
    Each hero has <b>skills</b> that cost MP (Z / X / C, or the buttons); area skills land where you click,
    and <b>Auto</b> lets the hero cast by themself. Space pauses; arrow keys or WASD scroll; the wheel zooms; middle-drag scrolls.
    If a general falls, their block is badly shaken. <b>Terrain</b> matters (point at the ground to see what it is): <b>hills</b> let shooters
    reach further, give melee the edge downhill and slow anyone climbing; <b>forests</b> hide the troops in them
    until the enemy is close (or they attack), slow units and shelter them from arrows; rivers can be crossed quickly only at the fords and bridges,
    mud, snow and sand slow everyone, and rocks and lava block the way. Archers, mages and artillery shoot from far off, so use them:
    an advance under their fire is costly, and blocks clash for a long, heavy fight. <b>Walled towns</b> have a thick wall in the middle
    of the field with three shut <b>gates</b>: right-click a gate to batter it down (artillery smashes gates, arrows barely scratch them).
    Defenders shoot from the rampart and can sally out through their own gates. When time runs out the defenders keep the town.</p>
  <p><b>Wandering generals</b> (marked with a gold coin on the map) drift between towns. Hire one while they are in a town you own.
    Defeated generals who are captured become wanderers too.</p>
  <p>Generals of the Free Towns join you when you take their town and they have nowhere to flee.
    You can also <b>Persuade</b> a <b>cornered</b> general (one whose town has no neighbouring town of their own side, the same
    rule as above) to join you for gold: click their town; you need one of your generals who has not acted, in a town next to
    theirs, to go as envoy. Stronger generals cost more, rival faction generals most of all; lords never sell out.
    Rival factions do the same - <b>keep your generals connected to your other towns</b> or they can be bribed away.</p>
  <p><b>Story:</b> events appear as dialogue - at the start, when you first reach each region, at milestones, and now and then
    at the start of a turn. Many offer a choice with gold, soldiers or experience at stake.</p>
  <p><b>End Turn</b> lets the other factions act, then every faction collects gold from its towns. The game autosaves each turn.</p>
</template>
