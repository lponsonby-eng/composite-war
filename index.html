<!doctype html>
<meta charset="utf-8">
<title>Composite War</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="css/style.css">

<div id="app">
  <header id="topbar">
    <span id="tb-faction" class="tb-faction"></span>
    <span class="tb-stat" title="Gold">Gold <b id="tb-gold">0</b></span>
    <span class="tb-stat" title="Turn">Turn <b id="tb-turn">1</b></span>
    <span class="tb-stat" title="Towns held">Towns <b id="tb-spots">0</b></span>
    <span class="tb-spacer"></span>
    <button id="btn-help" type="button">Help</button>
    <button id="btn-save" type="button">Save</button>
    <button id="btn-sound" type="button">Sound on</button>
    <button id="end-turn" type="button" class="primary">End Turn</button>
  </header>

  <main id="stage">
    <canvas id="view"></canvas>
    <div id="battle-hud"></div>
    <div id="battle-ctrl"></div>
    <div id="turn-banner" hidden></div>
    <div id="map-ctrl">
      <canvas id="minimap" width="200" height="120" title="Click to jump there"></canvas>
      <div class="zbtns"><button id="zoom-in" type="button" title="Zoom in">+</button><button id="zoom-out" type="button" title="Zoom out">-</button><button id="zoom-home" type="button" title="Back to your capital">Home</button></div>
    </div>
  </main>

  <aside id="panel"></aside>
  <footer id="log"></footer>
</div>

<div id="title-screen" hidden></div>
<div id="modal" hidden></div>

<template id="help-text">
  <h2>How to play</h2>
  <p><b>Goal:</b> defeat every rival faction by taking all their towns.</p>
  <p><b>The map:</b> drag to scroll (or use the arrow keys / WASD), scroll the mouse wheel or pinch to zoom.
    Click the minimap in the corner to jump anywhere; <b>Home</b> returns to your capital.</p>
  <p><b>Your turn:</b> click one of your towns (yellow name). Click generals in the side panel to tick or untick them.
    Roads to neighbouring towns light up: <b>white</b> = move there, <b>red</b> = attack.</p>
  <p><b>Frontline and backline:</b> generals leading melee troops are <b>Front</b>; those leading archers or casters are <b>Back</b>.
    In battle the frontline deploys in front and holds enemies up as they pass, and goes after anyone threatening its backline.
    The backline stays behind its front line, steps back from melee when it can, and hits weaker when caught in melee.
    Bring both: a backline with no frontline is easy prey.</p>
  <p>Each general can move or attack once per turn. <b>Recruiting</b> refills a general's squad for gold and is free to do any time.</p>
  <p><b>Battles</b> play out in real time. Give your army orders: <b>Advance</b>, <b>Hold</b> (stay put until enemies come close) or <b>Retreat</b>.
    If a general falls, their squad scatters. <b>Terrain</b> matters: forests slow units and shelter them from arrows,
    rivers can be crossed quickly only at the fords, mud slows everyone, and walled towns must be entered through the gates. When time runs out the defenders keep the town.</p>
  <p><b>Wandering generals</b> (marked with a gold coin on the map) drift between towns. Hire one while they are in a town you own.
    Defeated generals who are captured become wanderers too.</p>
  <p>Generals of the Free Towns join you when you take their town and they have nowhere to flee.</p>
  <p><b>End Turn</b> lets the other factions act, then every faction collects gold from its towns. The game autosaves each turn.</p>
</template>
